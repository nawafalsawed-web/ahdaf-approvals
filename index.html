<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة التعميد · أهداف</title>
<meta name="description" content="حملات أهداف ومحتواها جاهز للتعميد">
<style>
@font-face{font-family:SS;src:url(a/SaudiSerif-Regular.ttf);font-weight:400}
@font-face{font-family:SS;src:url(a/SaudiSerif-Bold.ttf);font-weight:700}
:root{--p:#4C0192;--ink:#111;--mut:#6b6477;--line:#e6e0ee;--bg:#fbfafd;--ok:#1f7a4d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SS,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{background:linear-gradient(120deg,#2C0055,#6A16B8);color:#fff;padding:28px 0 56px}
header img{height:38px}
h1{font-size:clamp(40px,7vw,80px);line-height:1.1;margin-top:48px}
header p{font-size:19px;opacity:.88;max-width:640px;margin-top:12px}
h2{font-size:30px;margin:56px 0 18px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cmp{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;color:inherit;text-decoration:none;transition:box-shadow .15s}
.cmp:hover{box-shadow:0 10px 26px rgba(44,0,85,.12)}
.cmp img{width:92px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:#eee;flex:none}
.cmp b{font-size:21px;display:block;line-height:1.3}
.cmp small{color:var(--mut);font-size:14px;display:block}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chips span{background:#f1e9fb;color:var(--p);border-radius:6px;padding:0 8px;font-size:13px}
.bar{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.cnt{font-size:13px;color:var(--mut);margin-top:4px}
.empty{color:var(--mut);padding:22px;border:1px dashed var(--line);border-radius:14px;text-align:center}
footer{color:var(--mut);text-align:center;padding:64px 0}
@media(max-width:600px){.wrap{padding:0 16px}h2{font-size:24px;margin-top:40px}.cmp img{width:76px}}
</style>
</head>
<body>
<header><div class="wrap">
 <img src="a/logo-white.png" alt="أهداف">
 <h1>منصة التعميد</h1>
 <p>كل حملة لها صفحة: المحتوى كما يظهر على المنصات، والاعتماد والملاحظات تنحفظ عند كل من يفتح الرابط.</p>
</div></header>
<main class="wrap">
 <h2>حملات حالية</h2><div class="list" id="active"></div>
 <h2>حملات سابقة</h2><div class="list" id="archived"></div>
</main>
<footer>أهداف · نربط الإبداع بالهدف · ahdaf.co</footer>
<script src="shared.js"></script>
<script>
fetch('campaigns.json').then(r=>r.json()).then(list=>{
 for(const k of ['active','archived']){
  const el=document.getElementById(k), L=list.filter(c=>(c.status||'active')===k);
  el.innerHTML=L.length?'':`<div class="empty">${k==='active'?'ما فيه حملة حالية':'ما فيه حملات سابقة'}</div>`;
  L.forEach(c=>{
   const a=document.createElement('a'); a.className='cmp'; a.href=`campaign.html?c=${c.slug}`;
   a.innerHTML=`<img src="campaigns/${c.slug}/${c.cover||'c/1.jpg'}" alt="" loading="lazy"><div style="flex:1;min-width:0">
    <b>${esc(c.title)}</b><small>${esc([c.client,c.date].filter(Boolean).join(' · '))}</small>
    <div class="chips">${(c.platforms||[]).map(p=>`<span>${PLAT[p].n}</span>`).join('')}</div>
    <div class="bar"><i style="width:0"></i></div><div class="cnt">${c.count} مقطع</div></div>`;
   el.appendChild(a);
   // live approval progress
   loadStates(c.slug).then(s=>{
    let ok=0; for(let i=1;i<=c.count;i++){const v=(s[i]||{}).v;if(v==='ok'||v==='final')ok++}
    a.querySelector('.bar i').style.width=(100*ok/c.count)+'%';
    a.querySelector('.cnt').textContent=`${ok} معتمد من ${c.count} مقطع`;
   }).catch(()=>{});
  });
 }
});
</script>
</body>
</html>
