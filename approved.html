<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المعتمد · أهداف</title>
<meta name="description" content="المحتوى المعتمد فقط، جاهز للنشر">
<style>
@font-face{font-family:SS;src:url(a/SaudiSerif-Regular.ttf);font-weight:400}
@font-face{font-family:SS;src:url(a/SaudiSerif-Bold.ttf);font-weight:700}
:root{--p:#4C0192;--ink:#111;--mut:#6b6477;--line:#e6e0ee;--bg:#fbfafd;--ok:#1f7a4d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SS,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header{background:linear-gradient(120deg,#2C0055,#6A16B8);color:#fff;padding:24px 0 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{height:34px}
.top a{color:#fff;font-size:15px;opacity:.85}
h1{font-size:clamp(34px,6vw,64px);line-height:1.1;margin-top:36px}
header p{opacity:.85;font-size:18px;margin-top:8px}
h2{font-size:28px;margin:48px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
video{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;display:block}
.card b{display:block;font-size:16px;margin:10px 0 6px}
.card small{color:var(--ok);font-size:13px}
.cap{white-space:pre-line;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:15px;margin-top:6px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;margin-top:8px}
.li{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
.li .cap{font-size:16px}
.empty{color:var(--mut);font-size:18px;padding:24px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.st{display:flex;gap:10px;flex-wrap:wrap}
.st span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px}
.st span.y{border-color:var(--ok);color:var(--ok)}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;margin:0}
.act .fin.on{background:var(--p);border-color:var(--p);color:#fff}
.card.final{border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset}
.card.final small{color:var(--p);font-weight:700}
.ed{display:none;margin-top:8px}.ed.open{display:block}
.ed textarea{font:inherit;font-size:14px;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:60px;resize:vertical}
.ed button{width:100%;background:#b5651d;border-color:#b5651d;color:#fff}
.me{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:14px;width:220px;max-width:100%}
.dl{display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;color:#4C0192;text-decoration:none;font-weight:700}
.dl:hover{background:#f4eefb}
.dl svg{width:16px;height:16px}
footer{color:var(--mut);text-align:center;padding:48px 0}
@media(max-width:640px){.wrap{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:8px}.li{grid-template-columns:1fr}h2{font-size:24px}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><img src="a/logo-white.png" alt="أهداف"><a id="back" href="./">← صفحة التعميد الكاملة</a></div>
 <h1 id="h1">المعتمد للنشر</h1>
 <p id="sum">نحمّل...</p>
</div></header>
<main class="wrap">
 <h2>الحالة العامة</h2>
 <div class="st" id="st"></div>
 <h2>المقاطع</h2>
 <input class="me" id="me" placeholder="اسمك (يظهر مع الاعتماد)" maxlength="40">
 <div class="grid" id="grid"></div>
 <div id="posts"></div>
</main>
<footer>أهداف · الصفحة تتحدّث تلقائياً مع صفحة التعميد</footer>
<script src="shared.js"></script>
<script>
const slug=qs('c')||'';
let C,base,last='',st={};
const med=(k,f)=>`${base}${k}/${f}?${C.rev||1}`;
const caption=c=>c.t+(C.tags?'\n'+C.tags:'');
// status 'final' = final sign-off, 'fix' sends it back for edits
function put(id,v,n){
 saveState(slug,id,{v,n,by:me()}).then(()=>{last='';load()}).catch(()=>alert('ما انحفظ، جرّب مرة ثانية'));
}
function copy(b,t){navigator.clipboard.writeText(t).then(()=>{b.textContent='✓ انتسخ';setTimeout(()=>b.textContent='نسخ الكابشن',1500)})}
const dl=n=>C.download?`<a class="dl" style="margin-top:8px" href="${dlUrl(C,n)}" download>${DL_ICON}تحميل المقطع</a>`:'';
async function load(){
 let s0; try{s0=await loadStates(slug)}catch(e){return}
 const j=JSON.stringify(s0); if(j===last)return;
 if([...document.querySelectorAll('video')].some(v=>!v.paused))return; // don't interrupt playback
 if(document.activeElement&&document.activeElement.tagName==='TEXTAREA')return; // don't wipe a note being typed
 st=s0; last=j;
 const v=id=>(st[id]||{}).v||'';
 const ok=C.items.filter(c=>v(c.i)==='ok'||v(c.i)==='final'), fin=ok.filter(c=>v(c.i)==='final').length;
 document.getElementById('sum').textContent=`${ok.length} من ${C.items.length} مقطع معتمد · ${fin} تعميد نهائي`;
 const extra=[...(C.posts||[]).map(p=>[p.id,p.short||p.label]),...(C.calendar?[['calendar','جدول النشر']]:[]),...(C.platforms.includes('ig')&&C.grid!==false?[['iggrid','شبكة إنستقرام']]:[])];
 document.getElementById('st').innerHTML=extra.map(([k,l])=>{const y=v(k)==='ok'||v(k)==='final';return `<span class="${y?'y':''}">${esc(l)}: ${y?'✓ معتمد':'لسا'}</span>`}).join('');
 const g=document.getElementById('grid');
 g.innerHTML=ok.length?'':'<div class="empty">ما فيه مقاطع معتمدة للحين</div>';
 ok.forEach(c=>{
  const cap=caption(c), f=v(c.i)==='final', el=document.createElement('div'); el.className='card'+(f?' final':'');
  el.innerHTML=`<video src="${med('v',c.i+'.mp4')}" poster="${med('c',c.i+'.jpg')}" controls playsinline preload="none"></video>
   <b>${pad(c.i)}. ${esc(c.t.replace(/\n/g,' '))}</b><small>${f?'✓ تعميد نهائي':'✓ معتمد'}</small>
   <div class="cap">${esc(cap)}</div><button class="cp">نسخ الكابشن</button>
   ${dl(pad(c.i))}
   <div class="act"><button class="fin ${f?'on':''}">${f?'✓ تعميد نهائي':'تعميد نهائي'}</button><button class="fx">تعديل</button></div>
   <div class="ed"><textarea placeholder="وش التعديل المطلوب؟"></textarea><button>إرسال التعديل</button></div>`;
  el.querySelector('.cp').onclick=e=>copy(e.target,cap);
  el.querySelector('.fin').onclick=()=>put(c.i,f?'ok':'final');
  const ed=el.querySelector('.ed');
  el.querySelector('.fx').onclick=()=>{ed.classList.toggle('open');ed.querySelector('textarea').focus()};
  ed.querySelector('button').onclick=()=>{const n=ed.querySelector('textarea').value.trim();if(n)put(c.i,'fix',n);else ed.querySelector('textarea').focus()};
  g.appendChild(el);
 });
 const box=document.getElementById('posts'); box.innerHTML='';
 (C.posts||[]).filter(p=>v(p.id)==='ok'||v(p.id)==='final').forEach(p=>{
  const d=document.createElement('div');
  d.innerHTML=`<h2>${esc(p.title||PLAT[p.platform].n)}</h2><div class="li">${p.video?`<video src="${med('v',p.video+'.mp4')}" poster="${med('c',p.video+'.jpg')}" controls playsinline preload="none"></video>`:'<div></div>'}
   <div><div class="cap">${esc(p.text)}</div><button>نسخ الكابشن</button>${p.dl?dl(p.dl):''}</div></div>`;
  d.querySelector('button').onclick=e=>copy(e.target,p.text);
  box.appendChild(d);
 });
}
fetch(`campaigns/${slug}/campaign.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 C=d; base=`campaigns/${slug}/`;
 document.title=`المعتمد · ${C.title}`; document.getElementById('h1').textContent=`المعتمد للنشر · ${C.title}`;
 document.getElementById('back').href=`campaign.html?c=${slug}`;
 load(); setInterval(load,10000);
}).catch(()=>document.getElementById('sum').textContent='الحملة مو موجودة');
</script>
</body>
</html>
